<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 1. 브라우저가 인식하는 즉시 리다이렉트 (가장 안전함) -->
    <meta http-equiv="refresh" content="0; url=https://cpbv-card-search.pages.dev/">
    <title>Redirecting...</title>
    
    <!-- 2. Meta 태그가 작동하지 않을 때를 대비한 자바스크립트 백업 -->
    <script>
        window.location.replace("https://cpbv-card-search.pages.dev/");
    </script>
</head>
<body>
    <!-- 3. 만약의 사태를 대비한 수동 링크 제공 -->
    <p>페이지가 이동 중입니다. 자동으로 이동하지 않으면 
       <a href="https://cpbv-card-search.pages.dev/">여기</a>를 클릭하세요.
    </p>
</body>
</html>
